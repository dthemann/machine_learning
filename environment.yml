# Conda environment for the "Machine Learning with Python" course.
#
#   conda env create -f environment.yml      (or: mamba env create -f environment.yml)
#   conda activate ml-course
#   jupyter lab
#
# Everything in the "core" block is required: the notebooks will not run without it.
# The "optional" block is used only by clearly marked, guarded sections — each notebook
# runs to the end without them and prints a one-line note where a section is skipped.
# If installation of the optional block is slow or fails on your platform, delete those
# lines; nothing essential is lost.
#
# Tested with Python 3.11 on Linux, macOS (Intel and Apple silicon) and Windows.
# No GPU is needed: every notebook runs on a laptop CPU in a few minutes.

name: ml-course

channels:
  - conda-forge

dependencies:
  # ---------------------------------------------------------------- core ----
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.11
  - scikit-learn>=1.8          # notebooks 07 and 12 use APIs added in 1.8
  - matplotlib-base>=3.8
  - seaborn>=0.13
  - joblib>=1.3

  # --------------------------------------------------- notebook interface ----
  - jupyterlab>=4.0
  - notebook>=7.0
  - ipykernel>=6.29
  - ipywidgets>=8.1            # progress bars and interactive widgets
  - jupyterlab_widgets>=3.0

  # ----------------------------------------------------- optional extras ----
  # Each of these is imported inside a try/except; the notebooks degrade gracefully.
  - statsmodels>=0.14          # 16: ARIMA/SARIMAX, STL, ADF test
  - xgboost>=2.0               # 10: comparison with scikit-learn's boosting
  - lightgbm>=4.1              # 10: comparison with scikit-learn's boosting
  - shap>=0.44                 # 17: TreeSHAP and the standard SHAP plots
  - optuna>=3.5                # 12: Bayesian / TPE hyper-parameter search
  - umap-learn>=0.5            # 14: UMAP embeddings
  - nltk>=3.8                  # 15: tokenisers, stop-word lists, stemmers
  - gensim>=4.3                # 15: word2vec and pre-trained embeddings
  - fairlearn>=0.10            # 19: fairness metrics and mitigation
  - flask>=3.0                 # 18: the minimal prediction endpoint
  - pyarrow>=14.0              # 18: Parquet input/output
  - tabulate>=0.9              # 18: DataFrame.to_markdown()
  - tqdm>=4.66                 # progress bars in the longer loops
  - pytest>=8.0                # 18: the test-suite section
  - openpyxl>=3.1              # reading/writing .xlsx if you bring your own data
